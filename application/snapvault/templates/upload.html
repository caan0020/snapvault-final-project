{% extends "base.html" %}
{% block title %}Upload &middot; {{ album.name }}{% endblock %}

{% block content %}
<h1>Upload to &ldquo;{{ album.name }}&rdquo;</h1>

<form method="post" enctype="multipart/form-data" class="stacked">
  <label>
    Title
    <input type="text" name="title" required maxlength="160">
  </label>
  <label>
    Description
    <textarea name="description" rows="3" maxlength="2000"></textarea>
  </label>
  <label>
    File
    <input type="file" name="file" required accept="image/*">
  </label>
  <button type="submit" class="btn primary">Upload</button>
  <a class="btn" href="{{ url_for('main.album_detail', album_id=album.id) }}">Cancel</a>
</form>
{% endblock %}
